<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tareas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class = "principal">
         <div class = "icono">
        <h1> <i class="fa-solid fa-clipboard-list"></i> Task Manager</h1>
       <div class = "texto"> <p>Organiza tus tareas con Task Manager</p></div>
         </div>
    <div class="main-container">
        <div id = "NuevaTarea"><h3> Nueva tarea</h3></div>
            <form onsubmit="handleFormSubmit(event)">
                <div class = "input-box">
                <i class="fa-solid fa-file-lines"></i>
                <input required type="text" placeholder="Title" name="title">
                </div>
                <div class="input-box2">
                <i class="fa-solid fa-align-left"></i>
                <textarea placeholder="Add the task description" name="description" rows="5"></textarea>
                </div>
                <div id = "agregar">
                <button type="submit"><i class="fa-solid fa-plus"></i> Agregar Tarea</button>
                </div>
                    <button type = "submit" id="cancelar">Cancelar</button>
            </form>
            <ul id="task-list-container" class="task-list"></ul>
          </div>

    </div>
    <script src="./index.js"></script>
</body>

</html>
